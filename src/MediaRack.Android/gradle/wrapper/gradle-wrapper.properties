# Gradle 版本与 build.gradle 里的 AGP 8.7.3 配套：AGP 8.7 要求 Gradle >= 8.9。
# 升 AGP 时这里要同步升，否则 configure 阶段直接报不兼容。
#
# validateDistributionUrl=false：wrapper 启动前不做 HEAD 预检。默认 true 时，
# 在挂了代理 / 企业网关的机器上，只要预检那一次握手失败就整个构建失败，
# 哪怕真正的下载通得过。关掉它，URL 写错仍会在下载时以明确的错误暴露。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
